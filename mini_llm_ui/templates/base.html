<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}mini-llm-ui{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='htmx.min.js') }}" defer></script>
</head>
<body>
  {% block body %}{% endblock %}

  <script>
    // CSRF: добавляем заголовок ко всем HTMX-запросам.
    document.body.addEventListener('htmx:configRequest', (evt) => {
      const meta = document.querySelector('meta[name="csrf-token"]');
      if (meta) evt.detail.headers['X-CSRFToken'] = meta.content;
    });

    // Ctrl+Enter — отправка формы.
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' && e.ctrlKey && e.key === 'Enter') {
        const form = e.target.closest('form');
        if (form && !form.querySelector('button[type="submit"]')?.disabled) {
          e.preventDefault();
          form.requestSubmit();
        }
      }
    });

    // Единый beforeSwap:
    //  1) для ожидаемых 4xx (400/409) с HX-Retarget — включаем swap;
    //  2) фиксируем позицию скролла ДО swap для «умного автоскролла».
    document.body.addEventListener('htmx:beforeSwap', (evt) => {
      const status = evt.detail.xhr && evt.detail.xhr.status;
      if (status === 400 || status === 409) {
        evt.detail.shouldSwap = true;
        evt.detail.isError = false;
      }

      const box = document.getElementById('messages');
      if (!box) return;
      const near = box.scrollHeight - box.scrollTop - box.clientHeight < 200;
      box.dataset.autoscroll = near ? '1' : '0';
    });

    document.body.addEventListener('htmx:afterSwap', (e) => {
      const box = document.getElementById('messages');
      if (box) {
        const target = e.detail && e.detail.elt;
        const inside = target && (box === target || box.contains(target));
        if (inside && box.dataset.autoscroll === '1') {
          box.scrollTop = box.scrollHeight;
        }
      }
    });

    // Непредвиденные ошибки: 5xx, а также 400 от CSRF/Host.
    document.body.addEventListener('htmx:responseError', (evt) => {
      const xhr = evt.detail.xhr;
      const box = document.getElementById('chat-error');
      if (box) {
        box.innerHTML =
          `<span class="error">Ошибка запроса (${xhr.status}): ` +
          `${xhr.statusText || 'см. логи'}</span>`;
      }
    });

    // ---------- Разблокировка composer'а после стрима ----------
    //
    // Раз в 500 мс проверяем наличие .message-polling в DOM.
    // Пока он есть — стрим идёт, composer заблокирован.
    // Как только исчез — стрим завершён, composer разблокируется.
    //
    // setInterval запускается СРАЗУ, а не через DOMContentLoaded:
    // скрипт в конце <body>, все элементы уже в DOM. Опора на
    // DOMContentLoaded здесь избыточна и на практике приводила
    // к тому, что интервал не запускался, и composer оставался
    // заблокированным до F5.
    //
    // Когда busy переходит из true в false, возвращаем фокус в
    // textarea и подсвечиваем поле — чтобы пользователь видел,
    // что можно печатать, без ручного клика.
    let previousBusy = null;

    function updateComposerState() {
      const form = document.querySelector('.composer');
      if (!form) return;
      const busy = document.querySelector('.message-polling') !== null;
      const btn = form.querySelector('button[type="submit"]');
      const ta = form.querySelector('textarea[name="content"]');

      if (btn && btn.disabled !== busy) btn.disabled = busy;
      if (ta && ta.disabled !== busy) ta.disabled = busy;
      form.classList.toggle('busy', busy);

      // Стрим только что завершился: busy сменился с true на false.
      // Возвращаем фокус в поле и коротко подсвечиваем его.
      if (previousBusy === true && busy === false && ta) {
        // Не крадём фокус, если вкладка в фоне или пользователь
        // явно переключился на другой input/textarea в документе.
        const active = document.activeElement;
        const userIsTypingElsewhere =
          active && active !== document.body &&
          (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') &&
          active !== ta;

        if (document.hasFocus() && !userIsTypingElsewhere) {
          ta.focus();
          ta.classList.add('just-enabled');
          setTimeout(() => ta.classList.remove('just-enabled'), 900);
        }
      }

      previousBusy = busy;
    }

    // Первый вызов — сразу, если composer и polling в текущем DOM.
    updateComposerState();
    // Регулярная проверка каждые 500 мс.
    setInterval(updateComposerState, 500);

    // ---------- Сворачиваемая и раздвигаемая боковая панель ----------
    (function initSidebar() {
      const layout = document.getElementById('layout');
      const toggle = document.getElementById('sidebar-toggle');
      const sidebar = document.getElementById('sidebar');
      const resizer = document.getElementById('sidebar-resizer');
      if (!layout || !toggle || !sidebar || !resizer) return;

      const MIN_WIDTH = 180;
      const MAX_WIDTH = 600;
      const STORAGE_WIDTH = 'mini-llm-ui.sidebar.width';
      const STORAGE_COLLAPSED = 'mini-llm-ui.sidebar.collapsed';

      function clamp(width) {
        return Math.max(MIN_WIDTH, Math.min(MAX_WIDTH, width));
      }

      function applyCollapsed(collapsed) {
        layout.classList.toggle('collapsed', collapsed);
        toggle.textContent = collapsed ? '›' : '‹';
        toggle.title = collapsed ? 'Развернуть панель' : 'Свернуть панель';
        try {
          localStorage.setItem(STORAGE_COLLAPSED, collapsed ? '1' : '0');
        } catch (_) {}
      }

      try {
        const savedWidth = parseInt(localStorage.getItem(STORAGE_WIDTH) || '', 10);
        if (Number.isFinite(savedWidth)) {
          sidebar.style.width = clamp(savedWidth) + 'px';
        }
        if (localStorage.getItem(STORAGE_COLLAPSED) === '1') {
          applyCollapsed(true);
        }
      } catch (_) {}

      toggle.addEventListener('click', () => {
        const collapsed = layout.classList.contains('collapsed');
        applyCollapsed(!collapsed);
      });

      resizer.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        resizer.setPointerCapture(event.pointerId);
        resizer.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';

        const startX = event.clientX;
        const startWidth = sidebar.getBoundingClientRect().width;
        let lastWidth = startWidth;

        function onMove(moveEvent) {
          const delta = moveEvent.clientX - startX;
          lastWidth = clamp(startWidth + delta);
          sidebar.style.width = lastWidth + 'px';
        }

        function onUp() {
          resizer.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          resizer.removeEventListener('pointermove', onMove);
          resizer.removeEventListener('pointerup', onUp);
          resizer.removeEventListener('pointercancel', onUp);
          try {
            localStorage.setItem(STORAGE_WIDTH, String(Math.round(lastWidth)));
          } catch (_) {}
        }

        resizer.addEventListener('pointermove', onMove);
        resizer.addEventListener('pointerup', onUp);
        resizer.addEventListener('pointercancel', onUp);
      });
    })();

    // ---------- Изменение высоты поля ввода ----------
    (function initComposerResizer() {
      const composer = document.querySelector('.composer');
      const resizer = document.getElementById('composer-resizer');
      if (!composer || !resizer) return;

      const MIN_HEIGHT = 140;
      const MAX_HEIGHT_FRACTION = 0.7;
      const STORAGE_KEY = 'mini-llm-ui.composer.height';

      function maxHeight() {
        return Math.round(window.innerHeight * MAX_HEIGHT_FRACTION);
      }

      function clamp(height) {
        return Math.max(MIN_HEIGHT, Math.min(maxHeight(), height));
      }

      try {
        const saved = parseInt(localStorage.getItem(STORAGE_KEY) || '', 10);
        if (Number.isFinite(saved)) {
          composer.style.height = clamp(saved) + 'px';
        }
      } catch (_) {}

      resizer.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        resizer.setPointerCapture(event.pointerId);
        resizer.classList.add('dragging');
        document.body.style.cursor = 'row-resize';
        document.body.style.userSelect = 'none';

        const startY = event.clientY;
        const startHeight = composer.getBoundingClientRect().height;
        let lastHeight = startHeight;

        function onMove(moveEvent) {
          const delta = startY - moveEvent.clientY;
          lastHeight = clamp(startHeight + delta);
          composer.style.height = lastHeight + 'px';
        }

        function onUp() {
          resizer.classList.remove('dragging');
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          resizer.removeEventListener('pointermove', onMove);
          resizer.removeEventListener('pointerup', onUp);
          resizer.removeEventListener('pointercancel', onUp);
          try {
            localStorage.setItem(STORAGE_KEY, String(Math.round(lastHeight)));
          } catch (_) {}
        }

        resizer.addEventListener('pointermove', onMove);
        resizer.addEventListener('pointerup', onUp);
        resizer.addEventListener('pointercancel', onUp);
      });

      window.addEventListener('resize', () => {
        const currentHeight = composer.getBoundingClientRect().height;
        const max = maxHeight();
        if (currentHeight > max) {
          composer.style.height = max + 'px';
        }
      });
    })();

    // ---------- Язык проверки правописания ----------
    (function initSpellcheckLanguage() {
      const select = document.getElementById('spellcheck-lang');
      const textarea = document.querySelector(
        '.composer textarea[name="content"]'
      );
      if (!select || !textarea) return;

      const STORAGE_KEY = 'mini-llm-ui.spellcheck.lang';

      function applyLanguage(value) {
        if (value === 'auto') {
          textarea.removeAttribute('lang');
        } else {
          textarea.setAttribute('lang', value);
        }
        try {
          localStorage.setItem(STORAGE_KEY, value);
        } catch (_) {}
      }

      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && ['ru', 'en', 'auto'].includes(saved)) {
          select.value = saved;
          applyLanguage(saved);
        }
      } catch (_) {}

      select.addEventListener('change', () => {
        applyLanguage(select.value);
      });
    })();
  </script>
</body>
</html>
