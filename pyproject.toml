[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-ui"
version = "1.0.0"
description = "Compact local web UI for Ollama models (Flask + HTMX + SQLite)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mini-llm-ui contributors" }]
keywords = ["ollama", "llm", "webui", "flask", "htmx", "sqlite"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

dependencies = [
    "Flask>=3.0,<4",
    "mistune>=3.0,<4",
    "ollama>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "mypy>=1.10,<2",
    "ruff>=0.6,<1",
    "pip-tools>=7.4,<8",
]

[project.scripts]
mini-llm-ui = "mini_llm_ui.__main__:main"

[project.urls]
Repository = "https://example.com/mini-llm-ui"

[tool.setuptools.packages.find]
include = ["mini_llm_ui*"]

[tool.setuptools.package-data]
mini_llm_ui = [
    "templates/**/*.html",
    "static/*.css",
    "static/*.js",
]

# ---------- ruff (линтер + форматер) ----------

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["mini_llm_ui", "tests"]
extend-exclude = [
    ".venv",
    "data",
    "uploads",
    "build",
    "dist",
    ".ruff_cache",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "C4",         # comprehensions
    "UP",         # pyupgrade
    "N",          # pep8-naming
    "S",          # bandit
    "RET",        # return statements
    "SIM",        # simplify
    "TID",        # tidy imports
    "PL",         # pylint subset
    "RUF",        # ruff-specific
    "SLF",        # private member access
]
ignore = [
    "PLR0913",    # too many arguments — иногда оправдано в конфиге
    "PLR2004",    # magic value — в тестах это осознанный выбор
    "PLW0603",    # global — единственный флаг идемпотентности logging
    "RUF001",     # ambiguous unicode — смешение кириллицы и латиницы
    "RUF002",     # в docstring — норма для русскоязычного проекта
    "RUF003",     # в комментариях — норма для русскоязычного проекта
]

[tool.ruff.lint.isort]
known-first-party = ["mini_llm_ui"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",       # assert в тестах — норма
    "S106",       # тестовый SECRET_KEY — не настоящий секрет
    "SLF001",     # доступ к внутренностям StreamManager
]
"mini_llm_ui/constants.py" = [
    "S105",       # SECRET_KEY_FILENAME — не пароль, а имя файла
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"

# ---------- mypy (строгая типизация) ----------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
files = ["mini_llm_ui", "tests"]

[[tool.mypy.overrides]]
module = "ollama.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mistune.*"
ignore_missing_imports = true

# ---------- pytest ----------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

# ---------- coverage ----------

[tool.coverage.run]
source = ["mini_llm_ui"]
branch = true
omit = [
    "mini_llm_ui/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]